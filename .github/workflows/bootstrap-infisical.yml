name: Bootstrap Infisical from existing GH secrets

# One-shot workflow: base64-encodes kite-cli's GH Actions secrets into a JSON
# artifact for local import to the Infisical Infrastructure project.
# Runner never contacts Infisical (private LAN unreachable from github.com).
# Delete this file after the local import succeeds.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BOOTSTRAP to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    if: ${{ inputs.confirm == 'BOOTSTRAP' }}
    runs-on: ubuntu-latest

    steps:
      - name: Dump secrets as base64 JSON
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          HOMEBREW_TAP_BOT_TOKEN: ${{ secrets.HOMEBREW_TAP_BOT_TOKEN }}
        run: |
          set -uo pipefail

          KEYS=(
            CLOUDFLARE_R2_ACCOUNT_ID
            CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_SECRET_ACCESS_KEY
            CLOUDFLARE_R2_BUCKET
            CLOUDFLARE_R2_PUBLIC_BASE_URL
            HOMEBREW_TAP_BOT_TOKEN
          )

          out=secrets.json
          printf '{' > "$out"
          first=1
          present=0
          empty=0

          for key in "${KEYS[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              empty=$((empty+1))
              continue
            fi
            b64=$(printf '%s' "$value" | base64 -w 0)
            if [ $first -eq 0 ]; then printf ',' >> "$out"; fi
            printf '"%s":"%s"' "$key" "$b64" >> "$out"
            first=0
            present=$((present+1))
          done
          printf '}' >> "$out"

          echo "Keys written to artifact:"
          jq -r 'keys[]' < "$out" | sort
          echo ""
          echo "==> present=$present empty=$empty / total=${#KEYS[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: infisical-bootstrap-secrets
          path: secrets.json
          retention-days: 1
