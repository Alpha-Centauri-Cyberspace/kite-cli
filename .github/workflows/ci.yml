name: ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  docs-drift:
    name: CLI docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate docs and diff
        run: |
          bash scripts/generate-cli-docs.sh
          if ! git diff --quiet docs/COMMANDS.md; then
            echo "::error::docs/COMMANDS.md is stale; run scripts/generate-cli-docs.sh and commit."
            git --no-pager diff docs/COMMANDS.md
            exit 1
          fi
