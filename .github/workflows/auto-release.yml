name: Release CLI

on:
  workflow_dispatch:

run-name: Release Kite CLI ${{ github.ref_name }}

permissions: {}

concurrency:
  # Serialize all releases so an older run cannot race a newer run and move
  # releases/latest.json backwards after both pass preflight.
  group: cli-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Verify release source
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_epoch: ${{ steps.source.outputs.source_epoch }}
      published_at: ${{ steps.source.outputs.published_at }}
    steps:
      - name: Check out release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify the protected tag
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || {
            echo "::error::Dispatch this workflow from an existing v* tag."
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must be clean semver vX.Y.Z."
            exit 1
          }
          git fetch --force --tags origin
          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null || {
            echo "::error::Release tag ${RELEASE_TAG} does not exist."
            exit 1
          }
          source_sha="$(git rev-list -n1 "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main || {
            echo "::error::Release tag is not reachable from origin/main."
            exit 1
          }
          git checkout --detach "$source_sha"
          python3 scripts/validate-release.py --tag "$RELEASE_TAG"

          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'source_epoch=%s\n' "$(git show -s --format=%ct "$source_sha")" >> "$GITHUB_OUTPUT"
          printf 'published_at=%s\n' "$(git show -s --format=%cI "$source_sha")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-2vcpu-ubuntu-2204
            name: kite-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: kite-darwin-arm64
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}

      - name: Build locked release binary
        env:
          KITE_VERSION: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          export KITE_VERSION="${KITE_VERSION#v}"
          cargo build --locked --release --target "${{ matrix.target }}"

      - name: Verify Linux GLIBC floor
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          KITE_GLIBC_FLOOR: "2.34"
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/kite"
          max_glibc="$(strings "$bin" | grep -oE '^GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -n1 || true)"
          [[ -n "$max_glibc" ]] || {
            echo "::error::No GLIBC_* symbols found in $bin."
            exit 1
          }
          max_version="${max_glibc#GLIBC_}"
          highest="$(printf '%s\n%s\n' "$KITE_GLIBC_FLOOR" "$max_version" | sort -V | tail -n1)"
          [[ "$highest" == "$KITE_GLIBC_FLOOR" ]] || {
            echo "::error::Binary requires GLIBC_${max_version}, above the GLIBC_${KITE_GLIBC_FLOOR} floor."
            exit 1
          }

      - name: Create reproducible archive and checksum
        run: |
          python3 scripts/package-release.py \
            --binary "target/${{ matrix.target }}/release/kite" \
            --output "${{ matrix.name }}.tar.gz" \
            --source-date-epoch "${{ needs.preflight.outputs.source_epoch }}"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

  release:
    name: Publish approved release
    needs: [preflight, build]
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.tar.gz*' -exec mv '{}' release/ \;

      - name: Validate storage configuration
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET PUBLIC_BASE_URL; do
            [[ -n "${!variable:-}" ]] || {
              echo "::error::$variable is not configured"
              exit 1
            }
          done

      - name: Build and validate deterministic release manifest
        env:
          PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          PUBLISHED_AT: ${{ needs.preflight.outputs.published_at }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${PUBLIC_BASE_URL%/}"
          assets='[]'
          for file in release/*.tar.gz; do
            name="$(basename "$file")"
            sha_file="release/${name}.sha256"
            [[ -f "$sha_file" ]] || {
              echo "::error::Missing checksum for $name"
              exit 1
            }
            sha="$(cut -d' ' -f1 "$sha_file" | tr -d '\n')"
            size="$(stat -c%s "$file")"
            url="${base_url}/releases/${RELEASE_TAG}/${name}"
            item="$(jq -nc --arg name "$name" --arg sha "$sha" --arg url "$url" --argjson size "$size" '{name:$name,size:$size,sha256:$sha,download_url:$url}')"
            assets="$(jq -nc --argjson values "$assets" --argjson item "$item" '$values + [$item]')"
          done
          jq -S -nc \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg published_at "$PUBLISHED_AT" \
            --argjson assets "$assets" \
            '{tag_name:$tag,source_sha:$source_sha,published_at:$published_at,assets:$assets}' \
            > release/manifest.json
          cp release/manifest.json release/latest.json
          python3 scripts/validate-release.py \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --manifest release/manifest.json \
            --artifacts-dir release

      - name: Upload or verify immutable R2 objects
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          verify_or_upload() {
            local source="$1"
            local key="$2"
            local cache_control="$3"
            local content_type="$4"
            local destination="s3://${R2_BUCKET}/${key}"
            local existing="${RUNNER_TEMP}/existing-$(basename "$source")"
            if aws s3 cp "$destination" "$existing" --endpoint-url "$endpoint" --no-progress >/dev/null 2>&1; then
              cmp "$source" "$existing" || {
                echo "::error::Immutable object differs: $destination"
                exit 1
              }
              echo "Verified existing immutable object: $destination"
            else
              # A failed read is not proof that the key is absent. Create it
              # conditionally so a transient/auth failure can never overwrite
              # an existing immutable release object.
              aws s3api put-object \
                --bucket "$R2_BUCKET" \
                --key "$key" \
                --body "$source" \
                --if-none-match '*' \
                --endpoint-url "$endpoint" \
                --cache-control "$cache_control" \
                --content-type "$content_type" \
                >/dev/null || {
                  echo "::error::Could not verify or conditionally create immutable object: $destination"
                  exit 1
                }
            fi
          }
          for file in release/*.tar.gz; do
            verify_or_upload "$file" "releases/${RELEASE_TAG}/$(basename "$file")" "public, max-age=31536000, immutable" "application/gzip"
          done
          for file in release/*.tar.gz.sha256; do
            verify_or_upload "$file" "releases/${RELEASE_TAG}/$(basename "$file")" "public, max-age=31536000, immutable" "text/plain"
          done
          verify_or_upload release/manifest.json "releases/${RELEASE_TAG}/manifest.json" "public, max-age=31536000, immutable" "application/json"

      - name: Verify public immutable release artifacts
        env:
          PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${PUBLIC_BASE_URL%/}"
          manifest_url="${base_url}/releases/${RELEASE_TAG}/manifest.json"
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL "$manifest_url" -o /tmp/kite-manifest.json && break
            sleep 10
          done
          python3 scripts/validate-release.py \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --manifest /tmp/kite-manifest.json
          jq -r '.assets[] | [.download_url, .sha256] | @tsv' /tmp/kite-manifest.json |
            while IFS=$'\t' read -r url expected; do
              artifact="${RUNNER_TEMP}/$(basename "$url")"
              curl -fsSL "$url" -o "$artifact"
              actual="$(sha256sum "$artifact" | cut -d' ' -f1)"
              [[ "$actual" == "$expected" ]] || {
                echo "::error::Public checksum mismatch for $url"
                exit 1
              }
            done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          files: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Advance and verify the mutable latest pointer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp release/latest.json "s3://${R2_BUCKET}/releases/latest.json" \
            --endpoint-url "$endpoint" \
            --cache-control "public, max-age=60, stale-while-revalidate=300" \
            --content-type application/json \
            --no-progress
          latest_url="${PUBLIC_BASE_URL%/}/releases/latest.json"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$latest_url" -o /tmp/kite-latest.json &&
               jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag' /tmp/kite-latest.json >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Latest release pointer did not converge to $RELEASE_TAG"
          exit 1
