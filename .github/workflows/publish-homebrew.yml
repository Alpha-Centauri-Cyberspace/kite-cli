name: Prepare Homebrew formula PR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing CLI release tag (vX.Y.Z)'
        required: true
        type: string

run-name: Prepare Homebrew formula for ${{ inputs.tag }}

permissions: {}

concurrency:
  group: homebrew-formula-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  update-formula:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the tagged CLI source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must be clean semver vX.Y.Z."
            exit 1
          }
          git fetch --force --tags origin
          source_sha="$(git rev-list -n1 "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"
          [[ -n "$source_sha" ]] || {
            echo "::error::Release tag does not exist."
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_sha" origin/main || {
            echo "::error::Release tag is not reachable from origin/main."
            exit 1
          }
          git checkout --detach "$source_sha"
          python3 scripts/validate-release.py --tag "$RELEASE_TAG"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Fetch release manifest from R2
        id: manifest
        env:
          PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          BASE_URL="${PUBLIC_BASE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "${BASE_URL}/releases/${RELEASE_TAG}/manifest.json" -o manifest.json; then
              break
            fi
            echo "manifest not available yet (attempt ${attempt}); retrying..."
            sleep 10
          done
          if [ ! -s manifest.json ]; then
            echo "::error::failed to fetch manifest for ${RELEASE_TAG}"
            exit 1
          fi
          python3 scripts/validate-release.py \
            --tag "$RELEASE_TAG" \
            --source-sha "${{ steps.tag.outputs.source_sha }}" \
            --manifest manifest.json
          darwin_url="$(jq -r '.assets[] | select(.name == "kite-darwin-arm64.tar.gz") | .download_url' manifest.json)"
          darwin_sha="$(jq -r '.assets[] | select(.name == "kite-darwin-arm64.tar.gz") | .sha256'       manifest.json)"
          linux_url="$(jq -r '.assets[] | select(.name == "kite-linux-x86_64.tar.gz")  | .download_url' manifest.json)"
          linux_sha="$(jq -r '.assets[] | select(.name == "kite-linux-x86_64.tar.gz")  | .sha256'       manifest.json)"
          version="${RELEASE_TAG#v}"
          echo "version=${version}"       >> "$GITHUB_OUTPUT"
          echo "darwin_url=${darwin_url}" >> "$GITHUB_OUTPUT"
          echo "darwin_sha=${darwin_sha}" >> "$GITHUB_OUTPUT"
          echo "linux_url=${linux_url}"   >> "$GITHUB_OUTPUT"
          echo "linux_sha=${linux_sha}"   >> "$GITHUB_OUTPUT"

      - name: Check out homebrew-kite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Alpha-Centauri-Cyberspace/homebrew-kite
          token: ${{ secrets.HOMEBREW_TAP_BOT_TOKEN }}
          path: homebrew-kite

      - name: Render formula
        env:
          VERSION:    ${{ steps.manifest.outputs.version }}
          DARWIN_URL: ${{ steps.manifest.outputs.darwin_url }}
          DARWIN_SHA: ${{ steps.manifest.outputs.darwin_sha }}
          LINUX_URL:  ${{ steps.manifest.outputs.linux_url }}
          LINUX_SHA:  ${{ steps.manifest.outputs.linux_sha }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-kite/Formula
          cat > homebrew-kite/Formula/kite.rb <<RUBY
          class Kite < Formula
            desc "Event delivery CLI for developers and AI agents"
            homepage "https://github.com/Alpha-Centauri-Cyberspace/kite-cli"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${DARWIN_URL}"
                sha256 "${DARWIN_SHA}"
              end
            end

            on_linux do
              on_intel do
                url "${LINUX_URL}"
                sha256 "${LINUX_SHA}"
              end
            end

            def install
              bin.install "kite"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/kite --version")
            end
          end
          RUBY

      - name: Validate, commit, and open a formula pull request
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_BOT_TOKEN }}
        run: |
          set -euo pipefail
          cd homebrew-kite
          cp Formula/kite.rb "${RUNNER_TEMP}/kite.rb"
          ruby -c Formula/kite.rb
          git config user.name  "kite-release-bot"
          git config user.email "kite-release-bot@users.noreply.github.com"
          branch="release/kite-${RELEASE_TAG}"
          if git fetch origin "$branch" 2>/dev/null; then
            git checkout -B "$branch" FETCH_HEAD
          else
            git checkout -b "$branch"
          fi
          cp "${RUNNER_TEMP}/kite.rb" Formula/kite.rb
          existing="$(gh pr list --repo Alpha-Centauri-Cyberspace/homebrew-kite --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if git diff --quiet Formula/kite.rb; then
            if [ -n "$existing" ]; then
              echo "Formula PR already open: $existing"
              exit 0
            elif git diff --quiet origin/main -- Formula/kite.rb; then
              echo "Formula already matches ${RELEASE_TAG}; no PR needed."
              exit 0
            else
              echo "Formula branch already contains ${RELEASE_TAG}; opening a replacement PR."
            fi
          else
            git add Formula/kite.rb
            git commit -m "chore: update Kite to ${RELEASE_TAG}"
            git push origin "$branch"
          fi
          if [ -n "$existing" ]; then
            echo "Formula PR already open: $existing"
          else
            gh pr create \
              --repo Alpha-Centauri-Cyberspace/homebrew-kite \
              --head "$branch" \
              --base main \
              --title "chore: update Kite to ${RELEASE_TAG}" \
              --body "Updates the formula from the validated immutable manifest for [Kite CLI ${RELEASE_TAG}](https://github.com/Alpha-Centauri-Cyberspace/kite-cli/releases/tag/${RELEASE_TAG})."
          fi
