[package]
name = "kite-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Universal webhook adapter CLI — stream, proxy, and replay events through the Kite delivery network."
repository = "https://github.com/Alpha-Centauri-Cyberspace/kite-cli"
homepage = "https://github.com/Alpha-Centauri-Cyberspace/kite-cli"
readme = "README.md"
keywords = ["cli", "webhooks", "kite", "cloudevents"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "kite"
path = "src/main.rs"

[dependencies]
kite-protocol = "0.1"

cloudevents-sdk = { version = "0.9", features = ["axum", "reqwest"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"

clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
directories = "5"
toml = "0.8"
url = "2"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
glob-match = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
